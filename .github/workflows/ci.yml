name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run clean-core + behavioral test suite
        run: npm test

  artifact:
    name: shipped-zip integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: mcp-server
        run: npm ci

      # Rebuild the published extension zip from source, then run only the
      # artifact tests against the freshly built zip. This gates what actually
      # ships (byte-identity + no sensitive handlers inside the package) rather
      # than trusting the committed dist/ blob.
      - name: Rebuild extension package
        run: ./build.sh

      - name: Verify packaged artifacts
        working-directory: mcp-server
        run: >-
          node --import ./test/register-loader.mjs --test
          test/pack.test.js test/extension.test.js
